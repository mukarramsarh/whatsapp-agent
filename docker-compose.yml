version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wa-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-migrate:
    image: evoapicloud/evolution-api:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -rf ./prisma/migrations
        cp -r ./prisma/postgresql-migrations ./prisma/migrations

        out=$$(npx prisma migrate deploy --schema ./prisma/postgresql-schema.prisma 2>&1)
        code=$$?
        printf '%s\n' "$$out"

        if [ $$code -eq 0 ]; then
          echo "db-migrate: migrations applied successfully"
          exit 0
        fi

        if echo "$$out" | grep -q "P3005"; then
          echo "db-migrate: P3005 detected — baselining existing schema..."
          for f in prisma/postgresql-migrations/*.sql; do
            n=$$(basename "$$f" .sql)
            npx prisma migrate resolve --applied "$$n" --schema ./prisma/postgresql-schema.prisma 2>/dev/null || true
          done
          echo "db-migrate: baseline complete, retrying migrate deploy..."
          npx prisma migrate deploy --schema ./prisma/postgresql-schema.prisma
          exit $$?
        fi

        echo "db-migrate: migration failed with unexpected error (see above)"
        exit $$code
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}
      DATABASE_PROVIDER: postgresql
    networks:
      - wa-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "5020:8080"
    environment:
      # Server
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:5020}
      # Telemetry
      TELEMETRY: "false"
      # CORS
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      # Logging
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      # Database
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Authentication
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # WhatsApp session
      CONFIG_SESSION_PHONE_CLIENT: "WhatsApp Agent"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      # QR Code
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#198754"
      # Webhooks (global off; per-instance webhook set by bridge)
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - wa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "5021:5021"
    environment:
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      INSTANCE_NAME: ${INSTANCE_NAME:-whatsapp-agent}
      BRIDGE_PORT: 5021
      WEBHOOK_URL: ${WEBHOOK_URL:-http://bridge:5021/webhook}
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_DIR: /app/media
      OCR_API_URL: ${OCR_API_URL:-http://192.168.100.62:5010}
      OCR_API_KEY: ${OCR_API_KEY:-}
      # AI agent
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:8000/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-local-key}
      AI_EMBEDDING_URL: ${AI_EMBEDDING_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Voice
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      TTS_VOICE_EN: ${TTS_VOICE_EN:-en-US-JennyNeural}
      TTS_VOICE_AR: ${TTS_VOICE_AR:-ar-SA-HamedNeural}
    volumes:
      - media_data:/app/media
    networks:
      - wa-network
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5022:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - wa-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  pgadmin_data:
  media_data:

networks:
  wa-network:
    driver: bridge
