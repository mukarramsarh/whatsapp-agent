server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: wa_agent_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # Docker daemon-side filter — Promtail only ever discovers containers
        # carrying this label. This is the actual project-scoping mechanism;
        # it restricts what the Docker API returns to Promtail in the first
        # place, not just what gets stored/displayed afterward. The value
        # must match the `name:` pinned at the top of docker-compose.yml.
        filters:
          - name: label
            values: ["com.docker.compose.project=wa_agent"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.*)$'
        target_label: 'container'
    pipeline_stages:
      - docker: {}   # parses standard Docker JSON log-driver output (timestamp+stream+log)
