<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Agent Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; font-size: 0.9rem; }
    .sidebar {
      width: 220px; min-height: 100vh;
      background: #111827; position: fixed; top: 0; left: 0; z-index: 100;
    }
    .sidebar .brand { color: #25d366; font-weight: 700; font-size: 1rem; letter-spacing: .3px; }
    .sidebar a { color: #9ca3af; text-decoration: none; display: flex; align-items: center; gap: .5rem;
      padding: .5rem .75rem; border-radius: .375rem; transition: all .15s; }
    .sidebar a:hover { color: #fff; background: rgba(255,255,255,.08); }
    .sidebar a.active { color: #fff; background: #25d366; }
    .main-content { margin-left: 220px; padding: 1.75rem; }
    .card { border: none; border-radius: .75rem; }
    .table th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
    .badge { font-weight: 500; }
  </style>
</head>
<body>

<nav class="sidebar d-flex flex-column p-3 gap-1">
  <div class="brand mb-3 px-2 py-1">
    <i class="bi bi-whatsapp me-1"></i> WA Agent
  </div>
  <a href="/admin/users" class="{% if active == 'users' %}active{% endif %}">
    <i class="bi bi-people-fill"></i> Users
  </a>
  <a href="/admin/messages" class="{% if active == 'messages' %}active{% endif %}">
    <i class="bi bi-chat-dots-fill"></i> Messages
  </a>
</nav>

<div class="main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
